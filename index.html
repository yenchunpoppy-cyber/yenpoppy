<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YEN POPPY — 作品集">
  <title>WORKS | YEN POPPY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400&family=Noto+Serif+TC:wght@200;400&family=Noto+Sans+TC:wght@200;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <!-- Netlify Identity（後台登入用） -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body data-page="works">

  <!-- Header -->
  <header id="site-header">
    <a class="header-logo" href="/" aria-label="YEN POPPY 首頁">
      <img class="logo-mark"     src="" alt="YEN POPPY 圖標" style="display:none;">
      <img class="logo-wordmark" src="" alt="YEN POPPY"       style="display:none;">
      <span class="logo-fallback">YEN POPPY</span>
    </a>
    <!-- 導覽列（JS 動態填入） -->
    <nav id="site-nav" aria-label="主導覽"></nav>
    <!-- 漢堡按鈕（手機） -->
    <button id="hamburger" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- 手機導覽選單 -->
  <nav id="mobile-nav" aria-label="手機導覽" role="dialog" aria-modal="true"></nav>

  <!-- 作品網格 -->
  <main id="page-content">
    <div id="works-grid" role="list"></div>
  </main>

  <script src="/site.js"></script>
  <script>
    // Netlify Identity redirect
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => document.location.href = '/admin/');
        }
      });
    }
  </script>
</body>
</html>
