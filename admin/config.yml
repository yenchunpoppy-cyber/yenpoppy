backend:
  name: github
  repo: yenchunpoppy-cyber/yenpoppy
  branch: main
  base_url: https://spring-wind-df39yenpoppy-oauth.yenchun-poppy.workers.dev
media_folder: public/uploads
public_folder: /uploads

locale: zh-Hant

# ─────────────────────────────────────────────
# Collections
# ─────────────────────────────────────────────

collections:

  # ── 1. 網站設定 + 導覽列（singleton files）──
  - name: site
    label: 網站設定
    files:

      - name: settings
        label: 網站設定
        file: data/settings.json
        fields:

          - label: Logo 圖標（線條標誌）
            name: logoMark
            widget: image
            required: false
            hint: "header 高度連動此圖標高度，更換後記得存檔確認"

          - label: 標準字（YENPOPPY 字樣）
            name: logoWordmark
            widget: image
            required: false

          - label: 表單收件網址（Google Apps Script）
            name: formEndpoint
            widget: string
            required: false
            hint: "Contact 表單和估價表送出時寄到這裡；留空時改用客戶自己的 Email 寄出。設定方式見 apps-script/設定步驟.md"

          - label: Favicon
            name: favicon
            widget: image
            required: false
            hint: "建議正方形，至少 512×512px，系統自動產生各裝置尺寸"

          - label: 頭部背景色
            name: headerBg
            widget: color
            default: "#F9EDC5"

          - label: 全站背景色
            name: siteBg
            widget: color
            default: "#FAFAFA"

          - label: 首頁背景色（不填沿用全站背景色）
            name: homeBg
            widget: color
            required: false

          - label: 主要文字／線條色
            name: textColor
            widget: color
            default: "#121212"

          - label: 標題字體
            name: titleFont
            widget: select
            default: poppins-extralight
            options:
              - { label: "品牌字體：Montserrat＋Glow Sans TC", value: brand }
              - { label: "組合一：Poppins Extra Light", value: poppins-extralight }
              - { label: "組合二：Noto Serif TC", value: noto-serif-tc }
              - { label: "組合三：全襯線", value: all-serif }

          - label: 內文字體
            name: bodyFont
            widget: select
            default: poppins-extralight
            options:
              - { label: "品牌字體：Montserrat＋Glow Sans TC", value: brand }
              - { label: "組合一：Poppins Extra Light", value: poppins-extralight }
              - { label: "組合二：Noto Sans TC", value: noto-sans-tc }
              - { label: "組合三：全襯線", value: all-serif }

          - label: 裝飾花紋
            name: decorations
            widget: list
            required: false
            hint: "每筆花紋各自設定圖片、位置、尺寸；固定在瀏覽器視窗角落，捲動不移動"
            fields:
              - label: 花紋圖片
                name: image
                widget: image

              - label: 位置
                name: position
                widget: select
                options:
                  - { label: "左上", value: tl }
                  - { label: "上緣置中", value: tc }
                  - { label: "右上", value: tr }
                  - { label: "左下", value: bl }
                  - { label: "下緣置中", value: bc }
                  - { label: "右下", value: br }

              - label: 尺寸
                name: size
                widget: select
                default: medium
                options:
                  - { label: "小", value: small }
                  - { label: "中", value: medium }
                  - { label: "大", value: large }

              - label: 手機版隱藏
                name: mobileHide
                widget: boolean
                default: false

      - name: nav
        label: 導覽列
        file: data/nav.json
        fields:
          - label: 導覽項目
            name: items
            widget: list
            hint: "拖曳可調整順序；WORKS 類型固定連到作品列表頁"
            fields:
              - label: 顯示文字
                name: label
                widget: string

              - label: 類型
                name: type
                widget: select
                options:
                  - { label: "作品列表頁（WORKS）", value: works }
                  - { label: "模塊頁面", value: page }
                  - { label: "連結（例如估價表 /quote/）", value: link }

              - label: 連到的頁面（slug，類型選模塊頁面時填）
                name: page
                widget: string
                required: false

              - label: 連結網址（類型選連結時填）
                name: url
                widget: string
                required: false

      - name: about
        label: ABOUT 頁
        file: data/about.json
        fields:
          - { label: SEO 頁面標題, name: seoTitle, widget: string, required: false }
          - { label: SEO 描述（搜尋結果顯示的介紹，建議寫進各服務關鍵字）, name: seoDesc, widget: text, required: false }
          - { label: 英文大標, name: heroEn, widget: string }
          - { label: 黃底標語, name: heroLine, widget: string, required: false }
          - { label: 介紹圖片（作品局部照）, name: introImage, widget: image, required: false }
          - { label: 介紹圖片替代文字, name: introImageAlt, widget: string, required: false }
          - { label: 核心理念（關於我最上方一句；用 ==字== 加螢光）, name: motto, widget: string, required: false }
          - { label: 自我介紹（段落之間空一行）, name: intro, widget: text }
          - label: 數字
            name: stats
            widget: list
            max: 2
            fields:
              - { label: 數字, name: value, widget: string, required: false }
              - { label: 單位, name: unit, widget: string, required: false }
              - { label: 說明, name: label, widget: string }
          - label: 得獎
            name: awards
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: 獎項名稱（含年份）, name: title, widget: string }
              - { label: 得獎作品, name: work, widget: string, required: false }
              - { label: 連到作品 ID, name: link, widget: string, required: false }
              - { label: 獎座照片, name: image, widget: image, required: false }
          - { label: 設計能力標題（用 *字* 加螢光）, name: servicesTitle, widget: string, required: false }
          - { label: 設計能力說明, name: servicesDesc, widget: text, required: false }
          - label: 服務項目
            name: services
            widget: list
            summary: "{{fields.zh}}"
            fields:
              - { label: 英文名稱, name: en, widget: string }
              - { label: 中文名稱, name: zh, widget: string }
              - { label: 說明, name: desc, widget: text }
              - { label: 服務內容, name: items, widget: list, required: false }
              - { label: 圖示（SVG）, name: icon, widget: image, required: false }
              - label: 對應的作品標籤（點了會篩選作品）
                name: tags
                widget: select
                multiple: true
                options: ["Branding", "Packaging", "UI/UX", "Web Design", "Motion Graphics", "Illustration", "Art Direction", "Exhibition", "Social Media"]
          - { label: 品牌區標題（用 *字* 加螢光）, name: brandsTitle, widget: string, required: false }
          - { label: 品牌區說明, name: brandsDesc, widget: text, required: false }
          - { label: 品牌區小字, name: brandsNote, widget: string, required: false }
          - { label: 合作產業（只在電腦版顯示）, name: brandsIndustries, widget: list, required: false }
          - label: 參與品牌與專案
            name: brands
            widget: list
            summary: "{{fields.name}}"
            hint: "排序規則：兩排輪流分配（第 1、3、5…個在上排，第 2、4、6…個在下排）。請照「大、大、小、小、大、大…」排，每排就會大小品牌交錯；最前面兩個會在開場時置中。Logo 用透明背景 PNG。"
            fields:
              - { label: 品牌名稱, name: name, widget: string }
              - { label: Logo（灰階版）, name: logo, widget: image, required: false }
              - { label: Logo（彩色版，經過中間時顯示）, name: logoColor, widget: image, required: false }
              - { label: Logo 大小微調（1 = 原本，0.8 = 小一點）, name: scale, widget: number, value_type: float, required: false }
              - { label: 領域（英文，如 Beauty）, name: industry, widget: string, required: false }
              - { label: 連到作品 ID, name: work, widget: string, required: false }
          - { label: 經歷標題（用 *字* 加螢光）, name: journeyTitle, widget: string, required: false }
          - { label: 經歷說明, name: journeyDesc, widget: text, required: false }
          - label: 設計歷程
            name: journey
            widget: list
            summary: "{{fields.zh}}"
            fields:
              - { label: 年份（可留空，留空顯示編號）, name: year, widget: string, required: false }
              - { label: 小標（中文＋英文，例：選物店 Select Shop）, name: period, widget: string, required: false }
              - { label: 中文標題, name: zh, widget: string }
              - { label: 內容, name: desc, widget: text }
              - { label: 相關作品（作品 id）, name: works, widget: list, required: false }
          - { label: 合作流程標題, name: processTitle, widget: string, required: false }
          - label: 合作流程
            name: process
            widget: list
            summary: "{{fields.zh}}"
            fields:
              - { label: 英文, name: en, widget: string }
              - { label: 中文, name: zh, widget: string }
              - { label: 說明, name: desc, widget: string }

      - name: home
        label: 首頁與頁尾
        file: data/home.json
        fields:
          - { label: 首頁主標（用 ==字== 加螢光）, name: heroIntro, widget: list, max: 1 }
          - { label: 首頁副標, name: heroSub, widget: string, required: false }
          - label: 首頁主標下方連結
            name: heroLink
            widget: object
            required: false
            fields:
              - { label: 文字, name: text, widget: string, required: false }
              - { label: 網址, name: href, widget: string, required: false }
          - label: 精選作品說明（作品頁開頭會用到）
            name: selected
            widget: list
            required: false
            summary: "{{fields.id}}"
            fields:
              - { label: 作品 ID, name: id, widget: string }
              - { label: 一句話說明, name: statement, widget: text, required: false }
          - { label: 精選作品 ID（舊欄位）, name: featured, widget: list, required: false }
          - { label: 英文標題（舊欄位，可留空）, name: heroTitle, widget: string, required: false }
          - { label: 年份範圍（舊欄位）, name: heroYears, widget: string, required: false }
          - { label: 資訊行（舊欄位）, name: heroInfo, widget: list, required: false }
          - { label: 黃底標語（舊欄位）, name: heroLine, widget: string, required: false }
          - { label: 開場圖片作品 ID（舊欄位）, name: heroImages, widget: list, required: false }
          - { label: 頁尾結尾標題（全站共用）, name: ctaTitle, widget: string }
          - { label: 頁尾結尾說明, name: ctaText, widget: text, required: false }
          - { label: 頁尾主要按鈕文字, name: ctaButton, widget: string, required: false }

      - name: contact
        label: CONTACT 頁
        file: data/contact.json
        fields:
          - { label: SEO 頁面標題, name: seoTitle, widget: string, required: false }
          - { label: SEO 描述, name: seoDesc, widget: text, required: false }
          - { label: 標題, name: title, widget: string }
          - label: 兩條路卡片
            name: paths
            widget: list
            max: 2
            summary: "{{fields.title}}"
            fields:
              - { label: 標題, name: title, widget: string }
              - { label: 說明, name: desc, widget: string }
              - { label: 按鈕文字, name: button, widget: string }
              - { label: 連結, name: href, widget: string }
          - { label: 預算選項, name: budgets, widget: list, field: { label: 選項, name: option, widget: string } }
          - { label: Email, name: email, widget: string }
          - { label: Instagram 網址, name: instagram, widget: string, required: false }
          - { label: LinkedIn 網址, name: linkedin, widget: string, required: false }
          - { label: Behance 網址, name: behance, widget: string, required: false }
          - label: 常見問題
            name: faq
            widget: list
            summary: "{{fields.q}}"
            hint: "回答裡可以用 [文字](網址) 放連結"
            fields:
              - { label: 問題, name: q, widget: string }
              - { label: 回答, name: a, widget: text }
          - { label: 送出成功標題, name: sentTitle, widget: string }
          - { label: 送出成功說明, name: sentText, widget: text }

  # ── 2. 頁面（模塊頁引擎）──
  - name: pages
    label: 頁面
    folder: data/pages
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{title}}"
    fields:

      - label: 頁面名稱
        name: title
        widget: string

      - label: SEO 頁面標題（選填，不填自動帶入頁面名稱）
        name: seoTitle
        widget: string
        required: false

      - label: SEO 簡短描述（選填）
        name: seoDesc
        widget: string
        required: false

      - label: 頁面背景色（選填，不填沿用全站背景色）
        name: bg
        widget: color
        required: false

      - label: 模塊列表
        name: modules
        widget: list
        types:

          # ── 模塊 A ──
          - name: module_a
            label: "模塊 A：標題＋圖組"
            summary: "A｜{{fields.headline}}（{{fields.columns}}欄）"
            fields:

              - label: 標題（選填）
                name: headline
                widget: string
                required: false

              - label: 內文段落（選填，支援粗體/斜體/超連結）
                name: body
                widget: markdown
                required: false
                minimal: true

              - label: 圖片欄數
                name: columns
                widget: select
                default: "1"
                options:
                  - { label: "0 — 純文字（不放圖）", value: "0" }
                  - { label: "1 — 單張置中", value: "1" }
                  - { label: "2 欄", value: "2" }
                  - { label: "3 欄", value: "3" }
                  - { label: "滿版（跨出容器貼齊視窗）", value: fullwidth }

              - label: 純文字對齊（欄數為 0 時有效）
                name: textAlign
                widget: select
                default: left
                required: false
                options:
                  - { label: "靠左", value: left }
                  - { label: "置中", value: center }
                  - { label: "靠右", value: right }

              - label: 圖片間距（選填，不填沿用全站預設）
                name: gutter
                widget: select
                default: "default"
                required: false
                options:
                  - { label: "沿用全站預設", value: "default" }
                  - { label: "0px", value: "0" }
                  - { label: "8px", value: "8" }
                  - { label: "12px", value: "12" }
                  - { label: "16px", value: "16" }
                  - { label: "24px", value: "24" }

              - label: 背景色（選填，不填沿用頁面背景色）
                name: bg
                widget: color
                required: false

              - label: 圖片列表
                name: images
                widget: list
                required: false
                fields:
                  - label: 圖片
                    name: src
                    widget: image

                  - label: 圖片說明（SEO用，不填自動帶入標題，不顯示在前台）
                    name: alt
                    widget: string
                    required: false

                  - label: 疊加文字（選填，會印在圖片上）
                    name: overlayText
                    widget: string
                    required: false

                  - label: 文字位置（九宮格）
                    name: overlayPos
                    widget: select
                    default: bc
                    required: false
                    options:
                      - { label: "左上", value: tl }
                      - { label: "上置中", value: tc }
                      - { label: "右上", value: tr }
                      - { label: "左置中", value: ml }
                      - { label: "正中央", value: mc }
                      - { label: "右置中", value: mr }
                      - { label: "左下", value: bl }
                      - { label: "下置中", value: bc }
                      - { label: "右下", value: br }

          # ── 模塊 B ──
          - name: module_b
            label: "模塊 B：相簿"
            summary: "B｜相簿（{{fields.columns}}欄，{{fields.images.length}}張）"
            fields:

              - label: 欄數
                name: columns
                widget: select
                default: "3"
                options:
                  - { label: "2 欄", value: "2" }
                  - { label: "3 欄", value: "3" }
                  - { label: "4 欄", value: "4" }

              - label: 圖片間距（選填，不填沿用全站預設）
                name: gutter
                widget: select
                default: "default"
                required: false
                options:
                  - { label: "沿用全站預設", value: "default" }
                  - { label: "0px", value: "0" }
                  - { label: "8px", value: "8" }
                  - { label: "12px", value: "12" }
                  - { label: "16px", value: "16" }
                  - { label: "24px", value: "24" }

              - label: 背景色（選填）
                name: bg
                widget: color
                required: false

              - label: 圖片列表
                name: images
                widget: list
                fields:
                  - label: 圖片
                    name: src
                    widget: image

                  - label: 圖片說明（SEO用）
                    name: alt
                    widget: string
                    required: false

  # ── 3. 作品清單 ──
  - name: works
    label: 作品清單
    files:

      - name: works_index
        label: 作品清單
        file: data/works.json
        fields:

          - label: WORKS 首頁欄數
            name: homeColumns
            widget: select
            default: "3"
            options:
              - { label: "2 欄", value: "2" }
              - { label: "3 欄", value: "3" }
              - { label: "4 欄", value: "4" }

          - label: 圖片間距
            name: homeGutter
            widget: select
            default: "12"
            options:
              - { label: "0px", value: "0" }
              - { label: "8px", value: "8" }
              - { label: "12px", value: "12" }
              - { label: "16px", value: "16" }
              - { label: "24px", value: "24" }

          - label: 首頁背景色（選填，不填沿用全站背景色）
            name: homeBg
            widget: color
            required: false

          - label: 作品列表
            name: works
            widget: list
            summary: "{{fields.title}}"
            fields:

              - label: 作品 ID（英文，無空格，例：et-seq-nail）
                name: id
                widget: string

              - label: 作品標題
                name: title
                widget: string

              - label: 中文副標（作品卡片照片下方，格式「是什麼｜做了什麼」，例：中秋禮盒｜唱盤造型包裝、互動網站）
                name: subtitle
                widget: string
                required: false

              - label: 圖說（英文服務名，最多兩項，用全形「／」分隔，例：Packaging Design／Illustration）
                name: caption
                widget: string
                required: false

              - label: 服務分類（首頁篩選用；留空就依標籤自動判斷）
                name: services
                widget: select
                multiple: true
                required: false
                options: [BRAND, PACKAGING, DIGITAL, DISPLAY]

              - label: 年份
                name: year
                widget: string
                required: false
                pattern: ['^\d{4}$', '請填四位數年份，例：2025']

              - label: 客戶／品牌
                name: client
                widget: string
                required: false

              - label: 合作團隊（AGENCY）
                name: agency
                widget: string
                required: false

              - label: 封面影片（選填，mp4，有填就在列表播放）
                name: thumbnailVideo
                widget: file
                required: false

              - label: 作品說明（中文 1～3 句，100 字內）
                name: description
                widget: text
                required: false

              - label: 使用工具
                name: tools
                widget: select
                multiple: true
                required: false
                options: [Illustrator, Photoshop, InDesign, Figma, After Effects, Premiere Pro, Lightroom, Blender, Cinema 4D, Procreate]

              - label: 外部連結（選填，完整 https 網址）
                name: link
                widget: string
                required: false

              - label: 隱藏這件作品（勾選後網站上不顯示）
                name: hidden
                widget: boolean
                required: false
                default: false

              - label: 縮圖
                name: thumbnail
                widget: image

              - label: 縮圖說明（SEO／無障礙用，不填自動帶入標題）
                name: thumbnailAlt
                widget: string
                required: false

              - label: 分類標籤（選 1～3 個）
                name: tags
                widget: select
                multiple: true
                min: 1
                max: 3
                options: [Branding, Packaging, UI/UX, Web Design, Motion Graphics, Illustration, Art Direction, Exhibition, Social Media]

              - label: 作品內頁 SEO 標題（選填）
                name: seoTitle
                widget: string
                required: false

              - label: 作品內頁 SEO 描述（選填）
                name: seoDesc
                widget: string
                required: false

              - label: 作品內頁模塊（與一般頁面相同的模塊編輯器）
                name: modules
                widget: list
                required: false
                types:

                  - name: module_a
                    label: "模塊 A：標題＋圖組"
                    summary: "A｜{{fields.headline}}（{{fields.columns}}欄）"
                    fields:
                      - { label: 標題（選填）, name: headline, widget: string, required: false }
                      - { label: 內文（選填）, name: body, widget: markdown, required: false, minimal: true }
                      - label: 圖片欄數
                        name: columns
                        widget: select
                        default: "1"
                        options:
                          - { label: "0 — 純文字", value: "0" }
                          - { label: "1 — 單張置中", value: "1" }
                          - { label: "2 欄", value: "2" }
                          - { label: "3 欄", value: "3" }
                          - { label: "滿版", value: fullwidth }
                      - { label: 純文字對齊, name: textAlign, widget: select, default: left, required: false, options: [{label: 靠左, value: left},{label: 置中, value: center},{label: 靠右, value: right}] }
                      - { label: 圖片間距, name: gutter, widget: select, default: "default", required: false, options: [{label: 沿用全站, value: "default"},{label: "0px", value: "0"},{label: "8px", value: "8"},{label: "12px", value: "12"},{label: "16px", value: "16"},{label: "24px", value: "24"}] }
                      - { label: 背景色（選填）, name: bg, widget: color, required: false }
                      - label: 圖片列表
                        name: images
                        widget: list
                        required: false
                        fields:
                          - { label: 圖片, name: src, widget: image }
                          - { label: 圖片說明, name: alt, widget: string, required: false }
                          - { label: 疊加文字, name: overlayText, widget: string, required: false }
                          - { label: 文字位置, name: overlayPos, widget: select, default: bc, required: false, options: [{label: 左上, value: tl},{label: 上置中, value: tc},{label: 右上, value: tr},{label: 左置中, value: ml},{label: 正中央, value: mc},{label: 右置中, value: mr},{label: 左下, value: bl},{label: 下置中, value: bc},{label: 右下, value: br}] }

                  - name: module_b
                    label: "模塊 B：相簿"
                    fields:
                      - { label: 欄數, name: columns, widget: select, default: "1", options: [{label: "1欄（單欄大圖）", value: "1"},{label: "2欄", value: "2"},{label: "3欄", value: "3"},{label: "4欄", value: "4"}] }
                      - { label: 圖片間距, name: gutter, widget: select, default: "default", required: false, options: [{label: 沿用全站, value: "default"},{label: "0px", value: "0"},{label: "8px", value: "8"},{label: "12px", value: "12"},{label: "16px", value: "16"},{label: "24px", value: "24"}] }
                      - { label: 背景色（選填）, name: bg, widget: color, required: false }
                      - label: 圖片列表
                        name: images
                        widget: list
                        fields:
                          - { label: 圖片, name: src, widget: image }
                          - { label: 圖片說明, name: alt, widget: string, required: false }

  # ── 4. 分類標籤 ──
  - name: tags
    label: 分類標籤
    files:
      - name: tags_list
        label: 分類標籤
        file: data/tags.json
        fields:
          - label: 標籤列表
            name: tags
            widget: list
            hint: "這裡的標籤會出現在作品頁上方的篩選列。新增標籤時，作品編輯的標籤選項（admin/config.yml）也要加上同名項目"
            fields:
              - { label: 標籤名稱, name: name, widget: string }
              - { label: "對應頁面 slug（選填）", name: page, widget: string, required: false }
